<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office VBA 匯入與使用｜離線示範器</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;background:#eef1f4;color:#202124}.top{height:36px;background:#185c37;color:#fff;display:flex;align-items:center;padding:0 12px;gap:18px}.brand{font-weight:700}.tabs button,.toolbar button,.vbe button{border:0;background:transparent;padding:8px 12px;font:inherit;cursor:pointer}.tabs button{color:white}.tabs .active{background:#fff;color:#185c37}.ribbon{height:86px;background:white;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:8px;padding:8px 14px}.group{border-right:1px solid #ddd;padding-right:12px}.big{background:#f7f7f7!important;border:1px solid #ccc!important;border-radius:3px!important}.workspace{display:grid;grid-template-columns:1fr 420px;height:calc(100vh - 122px)}.office{background:white;overflow:auto}.excel-grid{border-collapse:collapse;width:100%;min-width:800px}.excel-grid th,.excel-grid td{border:1px solid #d7d7d7;height:28px;padding:4px 7px;font-size:13px}.excel-grid th{background:#f3f3f3;font-weight:400;text-align:center}.excel-grid .row{width:42px}.sheetbar{position:sticky;bottom:0;background:#f5f5f5;border-top:1px solid #ccc;padding:7px}.sheet{background:white;border-bottom:3px solid #217346;padding:6px 14px}.word{padding:34px;background:#d8d8d8;min-height:100%}.page{width:720px;min-height:920px;margin:auto;background:#fff;box-shadow:0 2px 8px #999;padding:70px 72px;line-height:1.8}.vbe{background:#f5f5f5;border-left:1px solid #aaa;display:flex;flex-direction:column;min-width:0}.vbe-title{background:#2b579a;color:#fff;padding:8px 10px;font-weight:600}.vbe-menu{border-bottom:1px solid #bbb;background:#fafafa}.vbe-menu button:hover{background:#ddd}.vbe-body{display:grid;grid-template-columns:150px 1fr;flex:1;min-height:0}.project{border-right:1px solid #aaa;background:#fff;padding:8px;font-size:13px;overflow:auto}.project h4{margin:4px 0}.module{padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.module.sel{background:#cfe8ff}.code{background:#fff;display:flex;flex-direction:column;min-width:0}.codebar{padding:5px;border-bottom:1px solid #bbb;background:#eee;font-size:12px}.code textarea{flex:1;border:0;resize:none;padding:10px;font-family:Consolas,monospace;font-size:12px;line-height:1.45;outline:0;white-space:pre}.status{padding:5px 8px;border-top:1px solid #aaa;background:#eee;font-size:12px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:9}.dialog{background:#fff;width:430px;box-shadow:0 8px 30px #0006;border:1px solid #777}.dialog h3{margin:0;padding:10px 14px;background:#f3f3f3;font-size:15px}.dialog .content{padding:18px}.dialog input{width:100%;padding:7px;margin-top:8px}.actions{text-align:right;padding:0 18px 16px}.actions button{padding:6px 18px;margin-left:6px}.hint{background:#fff4ce;border:1px solid #e5c365;padding:8px 12px;font-size:13px}.hidden{display:none}.switch{margin-left:auto;background:#fff!important;border:1px solid #ccc!important;border-radius:4px}.run{background:#e2f0d9!important;border:1px solid #9bbb59!important}.wordmode .top{background:#2b579a}.wordmode .tabs .active{color:#2b579a}.wordmode .sheet{border-color:#2b579a}
</style></head><body>
<div class="top"><span class="brand" id="appBrand">Excel</span><div class="tabs"><button>檔案</button><button>常用</button><button>插入</button><button>頁面配置</button><button>公式</button><button>資料</button><button>檢視</button><button class="active">開發人員</button></div><button class="switch" onclick="toggleOffice()">切換 Excel / Word</button></div>
<div class="ribbon"><div class="group"><button class="big" onclick="showVBE()">Visual Basic<br><small>Alt + F11</small></button><button class="big" onclick="openMacroDialog()">巨集<br><small>Alt + F8</small></button></div><div class="group"><button>錄製巨集</button><button>使用相對參照</button><button>巨集安全性</button></div><div class="hint">這是 HTML 離線示範器，不會真的執行 VBA；介面與流程可用來教「匯入 .bas → 找到巨集 → 執行」。</div></div>
<div class="workspace"><main class="office" id="office"></main><aside class="vbe" id="vbe"><div class="vbe-title">Microsoft Visual Basic for Applications</div><div class="vbe-menu"><button>檔案</button><button>編輯</button><button>檢視</button><button>插入</button><button>格式</button><button>偵錯</button><button onclick="runSelected()">▶ 執行</button><button onclick="document.getElementById('basInput').click()">匯入檔案...</button><input id="basInput" type="file" accept=".bas,.txt" multiple hidden></div><div class="vbe-body"><div class="project"><h4>VBAProject</h4><div>⊟ Microsoft Excel 物件</div><div class="module">　Sheet1</div><div class="module">　ThisWorkbook</div><div>⊟ 模組</div><div id="modules"></div></div><div class="code"><div class="codebar" id="codebar">(一般)　　(宣告)</div><textarea id="code" spellcheck="false">' 請按「匯入檔案...」選擇 .bas 模組\n' 或直接點左側已載入的示範模組</textarea></div></div><div class="status" id="status">就緒｜示範重點：VBE → 檔案 → 匯入檔案 → 選 .bas</div></aside></div>
<div class="modal" id="macroModal"><div class="dialog"><h3>巨集</h3><div class="content"><div>巨集名稱：</div><select id="macroList" size="7" style="width:100%;margin-top:8px"></select></div><div class="actions"><button onclick="closeModal()">取消</button><button class="run" onclick="runMacroFromDialog()">執行</button></div></div></div>
<div class="modal" id="inputModal"><div class="dialog"><h3 id="inputTitle">Microsoft Excel</h3><div class="content"><div id="inputPrompt"></div><input id="inputValue"></div><div class="actions"><button onclick="closeInput()">取消</button><button onclick="confirmInput()">確定</button></div></div></div>
<script>
let mode='excel', modules={}, selected='', pendingMacro='';
const builtins={
'B4_結構盤點':`Attribute VB_Name = "B4_結構盤點"\nOption Explicit\n\nSub 盤點表格結構()\n    ' 掃描目前工作表，產出不含真實資料的結構描述\n    ' 欄位位置、標題、推測型別、非空筆數、字元長度範圍、虛構範例\n    MsgBox "盤點完成。結構描述已放在新活頁簿。"\nEnd Sub`,
'B5_Excel去識別化':`Attribute VB_Name = "B5_Excel去識別化"\nOption Explicit\n\nSub 去識別化()\n    Dim nameCols As String\n    nameCols = InputBox("請輸入姓名欄的欄位字母，例如 B 或 B,E", "去識別化 步驟1")\n    ' 建立複本、姓名代號 P001...、遮蔽身分證/電話/地址/生日\nEnd Sub`,
'B6_Word去識別化':`Attribute VB_Name = "B6_Word去識別化"\nOption Explicit\n\nSub Word去識別化()\n    Dim names As String\n    names = InputBox("請輸入要代號化的姓名，以逗號分隔", "Word 去識別化 步驟1")\n    ' 另存複本，姓名→P001...，規則遮蔽敏感資料\nEnd Sub`,
'B8_盤點註記版':`Attribute VB_Name = "B8_盤點註記版"\nOption Explicit\n\nSub 盤點註記()\n    ' 掃描整本活頁簿並產生盤點註記表\nEnd Sub\n\nSub 匯出AI規格()\n    ' 將人工註記整理為可貼給 AI 的規格文字\nEnd Sub`,
'B9_Excel代號還原':`Attribute VB_Name = "B9_Excel代號還原"\nOption Explicit\n\nSub Excel代號還原()\n    ' 依姓名對照表把 P001... 還原，另存還原版\nEnd Sub`,
'B10_Word代號還原':`Attribute VB_Name = "B10_Word代號還原"\nOption Explicit\n\nSub Word代號還原()\n    ' 選擇對照表，將 Word 文件中的 P001... 還原，另存還原版\nEnd Sub`};
Object.assign(modules,builtins);
function renderOffice(){const o=document.getElementById('office'); if(mode==='excel'){o.innerHTML=`<table class="excel-grid"><tr><th></th>${['A','B','C','D','E','F','G'].map(x=>'<th>'+x+'</th>').join('')}</tr>${[['姓名','身分證字號','出生日期','地址','手機','服務狀態','備註'],['王小明','A123456789','85/3/12','示範縣示範市示範路 123 巷 5 號 3 樓','0912000678','追蹤中','下週聯繫'],['李美華','B234567890','72/11/5','示範市示範區示範路二段 45 號','0922000444','服務中','申請補助'],['陳大同','C121212121','90/7/1','示範縣示範鎮示範路 110 巷 5 號','0955000777','志工','120人次'],['林靜宜','D123456789','68/1/28','示範市示範區示範大道三段 99 號','0966000999','追蹤中','公文回覆']].map((r,i)=>'<tr><th class="row">'+(i+1)+'</th>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table><div class="sheetbar"><span class="sheet">個案資料</span>　＋</div>`}else{o.innerHTML=`<div class="word"><div class="page" id="wordPage"><h2 style="text-align:center">○○社會福利服務中心　個案訪視紀錄</h2><p>（本文件所有姓名、證號、電話、地址、日期均為虛構，僅供課程示範）</p><h3>壹、個案基本資料</h3><p>一、案主王小明，身分證字號 A123456789，出生日期 85年3月12日，現居示範縣示範市示範路 123 巷 5 號 3 樓，聯絡電話 0912000678。</p><p>二、案主李美華，身分證字號 B234567890，出生日期 72年11月5日，設籍示範市示範區示範路二段 45 號，聯絡電話 0922000444。</p><h3>貳、訪視摘要</h3><p>王小明表示近期求職困難；案主母親提供手機 0937000222 作為緊急聯絡。</p><p>李美華另提供另一支聯絡方式 0988000456，表示白天多以此支為主。</p></div></div>`}}
function renderModules(){let el=document.getElementById('modules');el.innerHTML='';Object.keys(modules).forEach(n=>{let d=document.createElement('div');d.className='module'+(n===selected?' sel':'');d.textContent='　'+n;d.onclick=()=>selectModule(n);el.appendChild(d)});updateMacros()}
function selectModule(n){selected=n;document.getElementById('code').value=modules[n];document.getElementById('codebar').textContent=n+'　(程式碼)';renderModules()}
function toggleOffice(){mode=mode==='excel'?'word':'excel';document.body.classList.toggle('wordmode',mode==='word');document.getElementById('appBrand').textContent=mode==='excel'?'Excel':'Word';document.getElementById('inputTitle').textContent='Microsoft '+(mode==='excel'?'Excel':'Word');renderOffice()}
function showVBE(){document.getElementById('vbe').scrollIntoView({behavior:'smooth'});document.getElementById('status').textContent='VBE 已開啟｜示範：檔案 → 匯入檔案... → 選擇 .bas'}
document.getElementById('basInput').addEventListener('change',async e=>{for(const f of e.target.files){let txt=await f.text();let n=f.name.replace(/\.bas$/i,'');modules[n]=txt;selected=n}renderModules();selectModule(selected);document.getElementById('status').textContent=`已匯入 ${e.target.files.length} 個模組｜左側「模組」下可看到 .bas`});
function macros(){let a=[];for(const [m,t] of Object.entries(modules)){for(const x of t.matchAll(/\bSub\s+([^\s(]+)/gi)) if(!/^Private$/i.test(x[1])) a.push({module:m,name:x[1]})}return a}
function updateMacros(){let s=document.getElementById('macroList');s.innerHTML='';macros().forEach(x=>{let o=document.createElement('option');o.value=x.name;o.textContent=x.name;o.dataset.module=x.module;s.appendChild(o)})}
function openMacroDialog(){updateMacros();document.getElementById('macroModal').style.display='flex'} function closeModal(){document.getElementById('macroModal').style.display='none'}
function runMacroFromDialog(){let s=document.getElementById('macroList');if(s.selectedIndex<0)return;pendingMacro=s.options[s.selectedIndex].value;closeModal();simulate(pendingMacro)}
function runSelected(){let t=document.getElementById('code').value,m=t.match(/\bSub\s+([^\s(]+)/i); if(m)simulate(m[1]);else alert('找不到可執行的 Sub。')}
function simulate(n){pendingMacro=n;if(/Word去識別化/.test(n)){if(mode!=='word')toggleOffice();ask('請輸入要代號化的姓名，以逗號分隔：','王小明,李美華,陳大同,林靜宜')}else if(/^去識別化$/.test(n)){if(mode!=='excel')toggleOffice();ask('請輸入「姓名欄」的欄位字母（例如 A 或 A,E）：','A')}else if(/盤點/.test(n)){alert('盤點完成。\n\n示範結果：已建立「結構盤點／盤點註記表」，原始資料未修改。')}else if(/還原/.test(n)){alert('代號還原完成。\n\n示範結果：依對照表將 P001、P002…還原，並另存「_還原版」。原檔未修改。')}else if(/匯出AI規格/.test(n)){alert('AI 規格文字已產生。\n\n可直接複製貼給 AI，內容不包含真實個資。')}else alert('巨集「'+n+'」已執行（HTML 模擬）。')}
function ask(p,v){document.getElementById('inputPrompt').textContent=p;document.getElementById('inputValue').value=v;document.getElementById('inputModal').style.display='flex';document.getElementById('inputValue').focus()} function closeInput(){document.getElementById('inputModal').style.display='none'}
function confirmInput(){let v=document.getElementById('inputValue').value;closeInput(); if(/Word/.test(pendingMacro)){let p=document.getElementById('wordPage');let names=v.split(',').map(x=>x.trim()).filter(Boolean);let html=p.innerHTML;names.forEach((n,i)=>html=html.split(n).join('P'+String(i+1).padStart(3,'0')));html=html.replace(/[A-Za-z][12]\d{8}/g,'[身分證遮蔽]').replace(/09\d{8}/g,'[手機遮蔽]');p.innerHTML=html;alert('Word 去識別化完成（模擬）。\n已另存複本；原檔不動。\n另產生姓名對照表。')}else{document.querySelectorAll('.excel-grid td').forEach(td=>{let x=td.textContent;x=x.replace(/[A-Za-z][12]\d{8}/g,'[身分證遮蔽]').replace(/09\d{8}/g,'[手機遮蔽]');td.textContent=x});let rows=document.querySelectorAll('.excel-grid tr');for(let i=2;i<rows.length;i++)rows[i].children[1].textContent='P'+String(i-1).padStart(3,'0');alert('Excel 去識別化完成（模擬）。\n已建立複本與姓名對照表；原檔不動。')}}
renderOffice();renderModules();selectModule('B5_Excel去識別化');
</script></body></html>
