<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); font-family: var(--font-sans); font-size: var(--fs-sm); }
  .stack > * + * { margin-top: 12px; }
  .banner {
    background: var(--bg-surface); padding: 16px 20px;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    box-shadow: var(--shadow-sm); font-size: var(--fs-sm);
    position: relative;
  }
  .banner::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px; border-radius: var(--radius-md) 0 0 var(--radius-md);
  }
  .b-amber::before { background: var(--warn-500); }
  .b-red::before   { background: var(--danger-500); }
  .b-sky::before   { background: var(--info-600); }
  .b-slate::before { background: var(--fg-muted); }
  .title { font-weight: 700; font-size: var(--fs-base); }
  .red    { color: var(--danger-700); }
  .amber  { color: var(--warn-700); }
  .sky    { color: var(--info-700); }
  .sub    { color: var(--fg-2); margin-top: 6px; }
  .badge {
    display:inline-flex; align-items: center; padding: 3px 10px;
    font-size: var(--fs-xs); font-weight: 600;
    border-radius: var(--radius-pill);
    background: var(--danger-50); color: var(--danger-700);
    margin-left: 10px;
  }
</style>
</head>
<body>
<div class="stack">
  <div class="banner b-amber">
    <div class="title amber">新個案 — 待初次編輯</div>
    <div class="sub">此案件由 PDF 或匯入流程建立，請補齊欄位後儲存。</div>
  </div>
  <div class="banner b-red">
    <div class="title red">待確認派案 <span class="badge">逾時等級 2</span></div>
    <div class="sub">高志明 於 2026-05-14 09:32 送出，備註：本月新案，請優先安排訪視。</div>
  </div>
  <div class="banner b-sky">
    <div class="title sky">併案續處</div>
    <div class="sub">儲存時會先留下併案快照歷程，督導確認後才會真的併案。</div>
  </div>
  <div class="banner b-slate">
    <div class="title">已結案（唯讀）</div>
    <div class="sub">此案件目前不可直接編輯，可使用底部按鈕重啟案件。</div>
  </div>
</div>
</body>
</html>
