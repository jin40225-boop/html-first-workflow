<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); font-family: var(--font-sans); font-size: var(--fs-sm); }
  .label { font-size: var(--fs-xs); color: var(--fg-muted); width: 100%; margin: 0 0 10px; letter-spacing: .04em; }
  .strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }
  .strip-label { font-size: var(--fs-sm); color: var(--fg-muted); margin-right: 4px; font-weight: 500; }
  .action-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px;
    font-size: var(--fs-xs);
    font-weight: 600;
    border: 1px solid; border-radius: var(--radius-pill);
    background: none; line-height: 1.3; cursor: pointer;
    transition: filter 160ms;
  }
  .action-btn:hover { filter: brightness(0.95); }
  .action-btn-close    { background: var(--danger-50);  color: var(--danger-700); border-color: var(--danger-200); }
  .action-btn-merge    { background: var(--info-50);    color: var(--info-700);   border-color: var(--info-200); }
  .action-btn-grade    { background: var(--warn-50);    color: var(--warn-700);   border-color: var(--warn-200); }
  .action-btn-transfer { background: var(--success-50); color: var(--success-700);border-color: var(--success-200); }
  .action-btn-history  { background: var(--bg-surface-2); color: var(--fg-2);     border-color: var(--border-strong); }
  .action-btn-reopen   { background: var(--success-100);color: var(--success-900);border-color: var(--success-400); }
  .action-btn-reject   { background: var(--warn-100);   color: var(--warn-900);   border-color: var(--warn-300); }
  .action-btn-out      { background: var(--grape-50);   color: var(--grape-700);  border-color: var(--grape-200); }
</style>
</head>
<body>
  <p class="label">action-strip · 個案處理頁的有色快速按鈕（暖意版藥丸狀，色 = 語意）</p>
  <div class="strip">
    <span class="strip-label">快速操作</span>
    <button class="action-btn action-btn-close">結案</button>
    <button class="action-btn action-btn-merge">併案</button>
    <button class="action-btn action-btn-grade">分級覆核</button>
    <button class="action-btn action-btn-transfer">轉案</button>
    <button class="action-btn action-btn-history">歷程</button>
    <button class="action-btn action-btn-reopen">重啟</button>
    <button class="action-btn action-btn-reject">退案</button>
    <button class="action-btn action-btn-out">轉外轄</button>
  </div>
</body>
</html>
