<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-surface); font-family: var(--font-sans); font-size: var(--fs-sm); }
  .field { color: var(--fg-muted); font-size: var(--fs-xs); margin-bottom: 8px; letter-spacing: .04em; }
  .box {
    border: 1px solid var(--border-strong);
    background: var(--bg-surface);
    border-radius: var(--radius-pill);
    display: flex; align-items: stretch;
    padding: 4px 4px 4px 16px;
    transition: all 160ms;
  }
  .box:focus-within { border-color: var(--orange-700); box-shadow: var(--focus-ring); }
  .ico { display: grid; place-items: center; color: var(--fg-muted); }
  .inp { flex: 1; border: 0; outline: 0; padding: 8px 12px; font-size: var(--fs-sm); min-width: 0; background: transparent; color: var(--fg-1); }
  .toggle {
    border: 0; padding: 6px 14px; border-radius: var(--radius-pill);
    font-size: var(--fs-xs); font-weight: 600; color: var(--fg-1);
    background: var(--bg-surface-2); cursor: pointer;
  }
  .toggle:hover { background: var(--orange-50); }
  .results {
    margin-top: 10px; border: 1px solid var(--border);
    border-radius: var(--radius-md); background: var(--bg-surface);
    box-shadow: var(--shadow-pop); max-height: 320px; overflow: auto;
  }
  .item {
    display:flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 160ms;
  }
  .item:hover { background: var(--orange-50); }
  .item:last-child { border-bottom: 0; }
  .nm { font-weight: 600; font-size: var(--fs-base); color: var(--fg-1); }
  .meta { font-size: var(--fs-xs); color: var(--fg-muted); margin-top: 4px; }
  .open { font-size: var(--fs-xs); color: var(--fg-muted); font-weight: 500; }
</style>
</head>
<body>
<div class="field">搜尋姓名、身分證、轉介單號、個案編號</div>
<div class="box">
  <span class="ico">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </span>
  <input class="inp" placeholder="陳" value="陳">
  <button class="toggle">我的案件</button>
</div>
<div class="results">
  <div class="item">
    <div>
      <div class="nm">陳雅婷</div>
      <div class="meta">CA0099_0001 · 一級 · 在案處遇中</div>
    </div>
    <span class="open">開啟 →</span>
  </div>
  <div class="item">
    <div>
      <div class="nm">陳家豪</div>
      <div class="meta">CA0099_0099 · 三級 · 在案處遇中</div>
    </div>
    <span class="open" style="color: var(--warn-700)">請聯繫管理組</span>
  </div>
</div>
</body>
</html>
