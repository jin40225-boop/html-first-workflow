<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); font-family: var(--font-sans); font-size: var(--fs-sm); }
  .label { font-size: var(--fs-xs); color: var(--fg-muted); margin: 0 0 10px; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-label { font-size: var(--fs-sm); color: var(--fg-muted); font-weight: 500; }
  .kpi-value { font-size: var(--fs-2xl); font-weight: 700; margin-top: 8px; color: var(--fg-1); letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi-value.warn { color: var(--warn-700); }
  .kpi-value.danger { color: var(--danger-700); }
  .kpi-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: var(--fs-xs); color: var(--fg-muted); }
  .delta-up { background: var(--success-50); color: var(--success-600); padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 600; }
  .delta-dn { background: var(--danger-50); color: var(--danger-500); padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 600; }

  .card.tone-warn { background: linear-gradient(180deg, var(--warn-50) 0%, var(--bg-surface) 70%); border-color: var(--warn-200); }
  .card.tone-success { background: linear-gradient(180deg, var(--success-50) 0%, var(--bg-surface) 70%); border-color: var(--success-200); }
  .card.hero {
    background: linear-gradient(135deg, #e88e5e 0%, #d97757 60%, #c5613f 100%);
    border-color: transparent; color: #fff;
    grid-column: 1 / -1; position: relative; overflow: hidden;
  }
  .card.hero .kpi-label { color: rgba(255,255,255,.85); }
  .card.hero .kpi-value { color: #fff; font-size: 52px; }
  .card.hero::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }

  .link-card {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-surface);
    padding: 16px 20px; cursor: pointer; transition: all 160ms;
    text-decoration: none; color: inherit; display: block;
  }
  .link-card:hover { background: var(--orange-50); border-color: var(--orange-200); transform: translateY(-2px); box-shadow: var(--shadow-card); }
  .link-card .h { font-weight: 700; font-size: var(--fs-base); color: var(--fg-1); }
  .link-card .d { font-size: var(--fs-sm); color: var(--fg-muted); margin-top: 6px; }
</style>
</head>
<body>
<p class="label">KPI · bento 風格（hero + tonal）</p>
<div class="grid">
  <div class="card hero">
    <div class="kpi-label">今日新進案件</div>
    <div class="kpi-value">5 <span style="font-size: var(--fs-base); margin-left:6px; opacity:.85; font-weight:500;">件</span></div>
    <div class="kpi-foot" style="color: rgba(255,255,255,.85);">
      <span style="background: rgba(255,255,255,.2); color:#fff; padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 600;">↑ +3</span>
      較上週
    </div>
  </div>
  <div class="card"><div class="kpi-label">全庫個案</div><div class="kpi-value">150</div><div class="kpi-foot"><span class="delta-up">↑ +3</span>較上月</div></div>
  <div class="card tone-warn"><div class="kpi-label">待確認派案</div><div class="kpi-value warn">7</div><div class="kpi-foot">縣府分級 ≠ 服務分級</div></div>
</div>
<p class="label" style="margin-top:18px">Tile · 點擊式入口卡</p>
<div class="grid">
  <a class="link-card" href="#"><div class="h">官方個案總表</div><div class="d">輸出 cases / users / case_history 對齊的總表</div></a>
  <a class="link-card" href="#"><div class="h">月報管理</div><div class="d">產生 Excel 24 頁與 Word 7 表</div></a>
</div>
</body>
</html>
