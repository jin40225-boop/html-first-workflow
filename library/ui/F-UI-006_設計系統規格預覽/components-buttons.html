<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); font-family: var(--font-sans); font-size: var(--fs-base); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .label { font-size: var(--fs-xs); color: var(--fg-muted); width: 100%; margin: 6px 0 2px; letter-spacing: .04em; }
  .btn {
    all: unset; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: var(--radius-pill);
    font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
    transition: all 160ms;
    background: var(--bg-surface); color: var(--fg-1);
    border: 1px solid var(--border-strong); line-height: 1.3; white-space: nowrap;
  }
  .btn:hover { background: var(--orange-50); border-color: var(--orange-200); }
  .btn-primary { background: var(--fg-1); color: #fff; border-color: var(--fg-1); }
  .btn-primary:hover { background: var(--fg-2); border-color: var(--fg-2); }
  .btn-brand { background: var(--orange-700); color: #fff; border-color: var(--orange-700); box-shadow: 0 6px 16px rgba(217,119,87,.22); }
  .btn-brand:hover { background: var(--orange-800); border-color: var(--orange-800); }
  .btn-success { background: var(--success-600); color: #fff; border-color: var(--success-600); }
  .btn-success:hover { background: var(--success-700); border-color: var(--success-700); }
  .btn-soft { background: var(--orange-50); color: var(--orange-800); border-color: #f4c9aa; }
  .btn-soft:hover { background: #f4c9aa; }
  .btn-amber { background: var(--warn-50); color: var(--warn-700); border-color: var(--warn-200); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
  .btn-ghost:hover { background: var(--orange-50); border-color: transparent; }
  .btn-sm { padding: 6px 14px; font-size: var(--fs-xs); }
</style>
</head>
<body>
  <p class="label">PRIMARY · 主動作（深 ink 藥丸）</p>
  <div class="row">
    <button class="btn btn-primary">手動新增個案</button>
    <button class="btn btn-primary">套用</button>
    <button class="btn btn-primary">確認接案</button>
  </div>
  <p class="label">BRAND · 赭土紅（主要動作 / CTA）</p>
  <div class="row">
    <button class="btn btn-brand">＋ 新增個案</button>
    <button class="btn btn-brand">送出批次</button>
    <button class="btn btn-brand">正式產生月報</button>
  </div>
  <p class="label">SECONDARY · 次動作（白底框）</p>
  <div class="row">
    <button class="btn">重新偵測 PDF</button>
    <button class="btn">返回派案中心</button>
    <button class="btn">匯出 Excel</button>
  </div>
  <p class="label">SOFT / TONED · soft brand · success · warn</p>
  <div class="row">
    <button class="btn btn-soft">繼續編輯</button>
    <button class="btn btn-success">✓ 直接確認接案</button>
    <button class="btn btn-amber">需分級覆核 →</button>
    <button class="btn btn-ghost">不要這次</button>
  </div>
  <p class="label">SMALL · 表格 inline 動作（btn-sm）</p>
  <div class="row">
    <button class="btn btn-sm">歷程</button>
    <button class="btn btn-sm btn-brand">開啟</button>
    <button class="btn btn-sm btn-soft">補入</button>
  </div>
</body>
</html>
