<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg-app); font-family: var(--font-sans); height: 100vh; display: flex; }

  /* sidebar */
  aside {
    width: 240px; background: var(--bg-app-admin); border-right: 1px solid var(--border);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 22px;
    height: 100%; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #d97757 0%, #e89c66 100%);
    color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: var(--fs-base);
    box-shadow: 0 6px 16px rgba(217,119,87,.35);
  }
  .brand-text .t { font-weight: 700; font-size: var(--fs-base); color: var(--fg-1); line-height: 1.2; }
  .brand-text .s { font-size: var(--fs-xs); color: var(--fg-3); margin-top: 2px; }

  nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-section { font-size: var(--fs-xs); color: var(--fg-faint); letter-spacing: .14em; padding: 12px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: var(--radius-pill);
    font-size: var(--fs-sm); color: var(--fg-2); cursor: pointer;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--orange-50); color: var(--fg-1); }
  .nav-item.is-active {
    background: linear-gradient(120deg, #d97757 0%, #e7895d 100%);
    color: #fff; font-weight: 600;
    box-shadow: 0 6px 16px rgba(217,119,87,.28);
  }
  .nav-badge {
    margin-left: auto; background: var(--orange-700);
    color: #fff; font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: var(--radius-pill); line-height: 1.6;
  }
  .nav-item.is-active .nav-badge { background: rgba(255,255,255,.25); }

  .role {
    margin-top: auto;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px;
    display: flex; gap: 10px; align-items: center;
  }
  .role .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--orange-50); color: var(--orange-800); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); }
  .role .n { font-weight: 600; font-size: var(--fs-sm); }
  .role .r { font-size: var(--fs-xs); color: var(--fg-3); }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="brand-mark">DC</div>
    <div class="brand-text">
      <div class="t">身障個案系統</div>
      <div class="s">個案管理系統 · 暖意版</div>
    </div>
  </div>
  <nav>
    <div class="nav-section">主要功能</div>
    <a class="nav-item">工作儀表板</a>
    <a class="nav-item is-active">個案清單 <span class="nav-badge">2</span></a>
    <a class="nav-item">派案中心</a>
    <a class="nav-item">報表與圖表</a>
    <a class="nav-item">併案待審 <span class="nav-badge">3</span></a>
    <div class="nav-section">其他</div>
    <a class="nav-item">地圖視圖</a>
    <a class="nav-item">系統設定</a>
  </nav>
  <div class="role">
    <div class="avatar">志明</div>
    <div>
      <div class="n">高志明</div>
      <div class="r">管理組 · 督導</div>
    </div>
  </div>
</aside>
</body>
</html>
