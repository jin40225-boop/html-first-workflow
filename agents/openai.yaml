interface:
  display_name: "HTML 先行工作流"
  short_description: "Try the workflow and decide in one clickable HTML"
  default_prompt: "Use $html-first-workflow to design, build, migrate, validate, and evolve a software or web project. For new software or major workflow changes, first provide one integrated HTML with a working experience area and an eight-section decision area. Keep trials, unsaved drafts, and saved decisions distinct. Use a standalone review console only when there is no meaningful workflow to demonstrate; use a client demo for external audiences."
